aid: gameflip
name: Gameflip
description: >-
  Gameflip is a digital marketplace where gamers buy and sell games, in-game
  items, gift cards, game accounts, boosting/coaching gigs, and other digital
  goods, backed by an escrow-style buyer guarantee and a built-in wallet. For
  developers and power sellers, Gameflip publishes the GFAPI — a JSON REST API
  (base path /api/v1) for creating and managing listings, searching the
  marketplace, running exchanges (sell/buy records), reading account profiles
  and wallet history, and handling Steam item escrow and bulk trade-offer
  listings. Requests are authenticated with an API key plus a rotating TOTP
  one-time password sent in the Authorization header (`GFAPI <apikey>:<totp>`).
  Access is Beta and gated: API keys and TOTP secrets are issued to selected
  developers through Gameflip support / account settings. An official Node.js
  client library (gfapi) with sample code is published by Gameflip.
